  <!-- Google Maps API will be loaded by useJsApiLoader in React components -->
  <!-- Ensure Google Maps is available before vendor bundles execute -->
  <!-- Google Maps API will be loaded by useJsApiLoader in React components -->
  <!-- Ensure Google Maps is available before vendor bundles execute -->
  <script>
    // Prevent early 'google is not defined' references from third-party bundles
    (function () {
      try {
        if (typeof window !== 'undefined' && typeof window.google === 'undefined') {
          window.google = { maps: {} };
        } else if (typeof window !== 'undefined' && window.google && typeof window.google.maps === 'undefined') {
          window.google.maps = {};
        }
        // Provide minimal enums used by vendor bundles until real API loads
        var gm = window.google.maps;
        if (typeof gm.MapTypeId === 'undefined') {
          gm.MapTypeId = { ROADMAP: 'roadmap', SATELLITE: 'satellite', HYBRID: 'hybrid', TERRAIN: 'terrain' };
        } else if (typeof gm.MapTypeId.HYBRID === 'undefined') {
          gm.MapTypeId.HYBRID = 'hybrid';
        }

        // Minimal OverlayView placeholder (no-op) to avoid constructor errors before Maps loads
        if (typeof gm.OverlayView === 'undefined') {
          gm.OverlayView = function OverlayViewPlaceholder() { };
          gm.OverlayView.prototype = {
            constructor: gm.OverlayView,
            onAdd: function () { },
            onRemove: function () { },
            draw: function () { },
            setMap: function () { },
            getPanes: function () { return {}; },
            getProjection: function () {
              return {
                fromLatLngToDivPixel: function () { return { x: 0, y: 0 }; },
                fromDivPixelToLatLng: function () { return { lat: function () { return 0; }, lng: function () { return 0; } }; }
              };
            }
          };
        }

        // Provide placeholder for OverlappingMarkerSpiderfier to avoid vendor assignment crashes
        if (typeof gm.OverlappingMarkerSpiderfier === 'undefined') {
          gm.OverlappingMarkerSpiderfier = function PlaceholderOMS() {
            return {
              addMarker: function () { },
              removeMarker: function () { },
              clearMarkers: function () { },
              addListener: function () { },
              removeListener: function () { }
            };
          };
        }
      } catch (_) { }
    })();

    // Provide a global helper to remove the initial loader
    window.removeAppLoader = function () {
      try {
        var loader = document.querySelector('.app-loading');
        if (loader) loader.style.display = 'none';
      } catch (_) { }
    };

    // Aggressively try to remove the loader for the first 8 seconds
    (function aggressiveRemoveLoader() {
      try { window.removeAppLoader && window.removeAppLoader(); } catch (_) { }
      var start = Date.now();
      var tries = 0;
      var maxTries = 8;
      (function tick() {
        if (tries >= maxTries) return;
        tries++;
        try { window.removeAppLoader && window.removeAppLoader(); } catch (_) { }
        setTimeout(tick, 1000);
      })();
    })();

    // Hard-block any client-side GA4 Measurement Protocol calls from blocking UI
    (function () {
      try {
        const MP_PATTERN = 'google-analytics.com/mp/collect';

        // Wrap fetch
        const originalFetch = window.fetch;
        window.fetch = function (...args) {
          try {
            const url = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].url);
            if (url && url.includes(MP_PATTERN)) {
              // return resolved promise so callers never block
              return Promise.resolve(new Response(null, { status: 204 }));
            }
          } catch (_) { }
          return originalFetch.apply(this, args);
        };

        // Wrap sendBeacon
        if (navigator && navigator.sendBeacon) {
          const originalBeacon = navigator.sendBeacon.bind(navigator);
          navigator.sendBeacon = function (url, data) {
            try {
              if (typeof url === 'string' && url.includes(MP_PATTERN)) {
                return true; // pretend success
              }
            } catch (_) { }
            return originalBeacon(url, data);
          };
        }

        // Wrap XMLHttpRequest
        const OriginalXHR = window.XMLHttpRequest;
        function WrappedXHR() {
          const xhr = new OriginalXHR();
          const originalOpen = xhr.open;
          xhr.open = function (method, url, ...rest) {
            try {
              if (typeof url === 'string' && url.includes(MP_PATTERN)) {
                // Short-circuit: never actually send
                // Provide minimal interface for code expecting events
                setTimeout(() => {
                  try { xhr.onreadystatechange && xhr.onreadystatechange(); } catch (_) { }
                }, 0);
                // Use a no-op open to avoid throwing
                return originalOpen.call(xhr, method, 'about:blank', ...rest);
              }
            } catch (_) { }
            return originalOpen.call(xhr, method, url, ...rest);
          };
          return xhr;
        }
        window.XMLHttpRequest = WrappedXHR;
      } catch (e) {
        // no-op in production
      }
    })();

    // Enhanced global error handler for production resilience
    // One-time console note for maps init; then detach listener to avoid noise
    (function () {
      let mapsInitWarned = false;
      function onWindowError(event) {
        // Handle Google Maps API loading warnings
        if (event.message && event.message.includes('google is not defined')) {
          mapsInitWarned = true;
          // After first occurrence, stop listening to avoid repeated logs
          try { window.removeEventListener('error', onWindowError); } catch (_) { }
          event.preventDefault();
          return false;
        }

        // Suppress GA4 Measurement Protocol errors (should be handled server-side)
        if (event.message && event.message.includes('mp/collect')) {
          event.preventDefault();
          return false;
        }

        // Suppress fetch errors for analytics endpoints
        if (event.target && event.target.tagName === 'SCRIPT' &&
          event.target.src && event.target.src.includes('google-analytics.com')) {
          event.preventDefault();
          return false;
        }

        // Handle network errors gracefully
        if (event.message && event.message.includes('Failed to fetch')) {
          event.preventDefault();
          return false;
        }

        // Handle CORS errors gracefully
        if (event.message && event.message.includes('CORS')) {
          event.preventDefault();
          return false;
        }

        // Allow other errors to surface so we can diagnose blank-page issues
        // (Do not preventDefault here)
      }
      window.addEventListener('error', onWindowError);
    })();

    // Handle unhandled promise rejections for analytics
    window.addEventListener('unhandledrejection', function (event) {
      if (event.reason && event.reason.message &&
        (event.reason.message.includes('mp/collect') ||
          event.reason.message.includes('measurement_id'))) {
        console.warn('⚠️ Analytics promise rejection (non-critical):', event.reason.message);
        event.preventDefault();
        return false;
      }
    });
  </script>

  <!-- Critical CSS inline for above-the-fold content -->
  <style>
    /* Critical CSS for initial render */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #0a0c19;
      color: #ffffff;
    }

    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Loading spinner */
    .app-loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #0a0c19 0%, #10121e 100%);
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(81, 250, 170, 0.3);
      border-top: 3px solid #2dd284;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>

<body>
  <div id="root">

    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>

  <script>
    // Safety: hide initial loader after 4s even if React hasn't mounted yet
    (function () {
      try {
        setTimeout(function () {
          var loader = document.querySelector('.app-loading');
          if (loader) {
            loader.style.display = 'none';
          }
        }, 4000);
      } catch (e) { }
    })();

    // Unregister any existing service workers to avoid caching issues
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
    }

    // Handle browser extension errors gracefully
    window.addEventListener('error', (event) => {
      if (event.message && event.message.includes('message channel closed')) {
        event.preventDefault();
        return false;
      }
    });

    window.addEventListener('unhandledrejection', (event) => {
      if (event.reason && event.reason.message && event.reason.message.includes('message channel closed')) {
        event.preventDefault();
        return false;
      }
    });

    // Performance optimizations
    // Note: Image preloading removed to prevent unused resource warnings

    // Run optimizations after DOM is ready
    // Image preloading removed to prevent unused resource warnings

    // Optimize font loading
    const optimizeFonts = () => {
      if ('fonts' in document) {
        document.fonts.ready.then(() => {
          document.documentElement.classList.add('fonts-loaded');
        });
      }
    };

    optimizeFonts();
  </script>
