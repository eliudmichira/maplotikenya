name: maploti
description: "Maploti — Premium property search & listings app for Kenya."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  firebase_database: ^12.4.7

  # Authentication
  google_sign_in: ^7.2.0

  # State Management
  flutter_riverpod: ^2.6.1

  # Typography (Inter + JetBrains Mono from Google Fonts)
  google_fonts: ^8.2.1

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0

  # Utilities
  intl: ^0.20.3
  uuid: ^4.5.1

  # Deep Links & Sharing
  url_launcher: ^6.3.1

  # Image Picker & Compression
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.5
  path: ^1.9.0

  # Interactive Map & Geolocation
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2

  # Notifications
  flutter_local_notifications: ^19.0.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#141416"
    theme_color: "#E2FF5E"

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/properties/
    - assets/icon/
